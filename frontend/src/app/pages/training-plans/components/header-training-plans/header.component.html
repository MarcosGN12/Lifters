<section class="flex flex-col p-10">
    <div class="flex justify-between">
        <strong class="text-4xl">Training plans</strong>
    </div>
    <p class="pt-2">Manage and organize your curated physical and educational database.</p>

    <div class="flex justify-between items-center pt-6">
        <div class="flex gap-2">
            <lifters-button class="btn-info">All plans</lifters-button>
            <lifters-button class="btn-info">Beginner</lifters-button>
            <lifters-button class="btn-info">Intermediate</lifters-button>
        </div>

        <div>
            <lifters-button (click)="toggleDisplay()" class="btn-success">Add new training plan</lifters-button>
            <div [hidden]="isShow" class="flex">
                <form [formGroup] = "newTrainingPlanForm">
                    <div class="flex flex-col pb-4">
                        <label>Name</label>
                        <label class="input validator w-full bg-white">
                        <input
                            class="text-black"
                            type="text"
                            required
                            placeholder="TrainingPlan name"
                            formControlName="name"
                        >
                        </label>
                    </div>

                     <div class="flex flex-col pb-4">
                        <input 
                            type="hidden"
                            formControlName="userId"
                        >
                    </div>

                    <div class="flex flex-col pb-4">
                        <button (click)="createNewExercise()" class="bg-emerald-400 rounded-2xl p-2 cursor-pointer" type="submit">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
