<section>
    <div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100 m-10">
        <table class="table">
            <thead>
                <tr>
                    <th>EXERCISE NAME</th>
                    <th>CATEGORY</th>
                    <th>DIFFICULTY</th>
                    <th>INTENSITY</th>
                    <th class="text-center">LAST UPDATED</th>
                    <th class="text-center">ACTIONS</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <th>Push-ups</th>
                    <td><lifters-badge color="badge badge-soft badge-info" mode=""><p text>STRENGHT</p></lifters-badge></td>
                    <td><lifters-badge color="badge badge-soft badge-info"><p text>EASY</p></lifters-badge></td>
                    <td class="text-center">
                        <progress-bar classProgress="progress progress-info mr-6" [valueProgress]="40" [maxProgress]="100"><p text>4/10</p></progress-bar>
                    </td>
                    <td class="text-center">Oct 12, 2023</td>
                    <td class="text-center">
                        <div class="flex items-center justify-center gap-2 h-full w-full">
                            <lifters-icon nameIcon="Pen" classIcon="w-5 h-5 cursor-pointer" [sizeIcon]="20"></lifters-icon>
                            <lifters-icon  nameIcon="Trash2" classIcon="w-5 h-5 cursor-pointer" [sizeIcon]="20"></lifters-icon>
                        </div>
                    </td>
                </tr>

                <tr>
                    <th>Pull-ups</th>
                    <td><lifters-badge color="badge badge-soft badge-info"><p text>STRENGHT</p></lifters-badge></td>
                    <td><lifters-badge color="badge badge-soft badge-warning"><p text>MEDIUM</p></lifters-badge></td>
                    <td class="text-center">
                        <progress-bar classProgress="progress progress-warning mr-6" [valueProgress]="70" [maxProgress]="100"><p text>7/10</p></progress-bar>
                    </td>
                    <td class="text-center">Oct 12, 2023</td>
                    <td class="text-center">
                        <div class="flex items-center justify-center gap-2 h-full w-full">
                            <lifters-icon  nameIcon="Pen" classIcon="w-5 h-5 cursor-pointer" [sizeIcon]="20"></lifters-icon>
                            <lifters-icon  nameIcon="Trash2" classIcon="w-5 h-5 cursor-pointer" [sizeIcon]="20"></lifters-icon>
                        </div>
                    </td>
                </tr>

                <tr>
                    <th>Pine-push-ups</th>
                    <td><lifters-badge color="badge badge-soft badge-info"><p text>STRENGHT</p></lifters-badge></td>
                    <td><lifters-badge color="badge badge-soft badge-error"><p text>ADVANCED</p></lifters-badge></td>
                    <td class="text-center">
                        <progress-bar classProgress="progress progress-error mr-6" [valueProgress]="90" [maxProgress]="100"><p text>9/10</p></progress-bar>
                    </td>
                    <td class="text-center">Oct 12, 2023</td>
                    <td class="text-center">
                        <div class="flex items-center justify-center gap-2 h-full w-full">
                            <lifters-icon  nameIcon="Pen" classIcon="w-5 h-5 cursor-pointer" [sizeIcon]="20"></lifters-icon>
                            <lifters-icon  nameIcon="Trash2" classIcon="w-5 h-5 cursor-pointer" [sizeIcon]="20"></lifters-icon>
                        </div>
                    </td>
                </tr>

                <tr>
                    <th>Push-ups</th>
                    <td><lifters-badge color="badge badge-soft badge-info"><p text>STRENGHT</p></lifters-badge></td>
                    <td><lifters-badge color="badge badge-soft badge-warning"><p text>MEDIUM</p></lifters-badge></td>
                    <td class="text-center">
                        <progress-bar classProgress="progress progress-info mr-6" [valueProgress]="60" [maxProgress]="100"><p text>6/10</p></progress-bar>
                    </td>
                    <td class="text-center">Oct 12, 2023</td>
                    <td class="text-center">
                        <div class="flex items-center justify-center gap-2 h-full w-full">
                            <lifters-icon  nameIcon="Pen" classIcon="w-5 h-5 cursor-pointer" [sizeIcon]="20"></lifters-icon>
                            <lifters-icon  nameIcon="Trash2" classIcon="w-5 h-5 cursor-pointer" [sizeIcon]="20"></lifters-icon>
                        </div>
                    </td>
                </tr>

                <tr></tr>
            </tbody>
        </table>

            </div>

</section>
